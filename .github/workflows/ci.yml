name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "3"

jobs:
  ci:
    name: Build, Lint & Test
    runs-on: harness
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify code formatting
        run: cargo fmt --check

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Verify documentation
        run: cargo doc --no-deps

      - name: Run all tests (unit & integration)
        run: cargo test --all-targets

      - name: CI-safe system diagnostics (doctor)
        run: cargo run -- doctor --ci --json

  cross-compile:
    name: Windows Cross-Compile Gate
    runs-on: harness
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install cross-compilation prerequisites
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y mingw-w64
          else
            apt-get update && apt-get install -y mingw-w64
          fi
          rustup target add x86_64-pc-windows-gnu

      - name: Cargo check (x86_64-pc-windows-gnu)
        run: cargo check --target x86_64-pc-windows-gnu

      - name: Cargo clippy (x86_64-pc-windows-gnu)
        run: cargo clippy --target x86_64-pc-windows-gnu -- -D warnings
