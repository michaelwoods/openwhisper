[package]
name = "openwhisper"
version = "0.1.0"
edition = "2024"

authors = ["OpenWhisper Contributors"]
description = "A cross-platform speech-to-text assistant powered by Whisper and local OpenVINO / OpenAI-compatible endpoints."

[dependencies]
# Audio recording and encoding
cpal = "0.15"
hound = "3.5"
nnnoiseless = "0.5.2"

# Networking & Async
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json", "rustls-tls"] }

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
directories = "6.0"
chrono = "0.4"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Clipboard & Desktop integration
arboard = "3.4"
notify-rust = "4.11"

# Logging & Errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"

# GUI Configuration Panel & Native Toolkit
slint = { version = "1.17", default-features = false, features = ["std", "backend-default", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2"] }
eframe = { version = "0.35.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }

# Linux / Wayland D-Bus portal & virtual input & system tray
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.5", features = ["tokio"] }
evdev = "0.12"
ksni = "0.3.6"
winit = "0.30"

[build-dependencies]
slint-build = "1.17"

