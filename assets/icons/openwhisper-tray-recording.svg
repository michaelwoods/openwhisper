  <path d="M 22 9 A 6 6 0 0 1 22 15" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round" />

  <!-- Microphone capsule in active red/white -->
  <rect x="8" y="2" width="8" height="12" rx="4" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
  <path d="M 5 10 C 5 14.5 8 16.5 12 16.5 C 16 16.5 19 14.5 19 10" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="12" y1="16.5" x2="12" y2="21" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <line x1="8" y1="21" x2="16" y2="21" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

  <!-- Active Recording Dot -->
