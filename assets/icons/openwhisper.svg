<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bg)" stroke="#334155" stroke-width="4" />

  <!-- Acoustic Sound Waves (Left) -->
  <path d="M 66 100 A 36 36 0 0 0 66 156" fill="none" stroke="url(#wave-grad)" stroke-width="5" stroke-linecap="round" />
  <path d="M 50 84 A 56 56 0 0 0 50 172" fill="none" stroke="url(#wave-grad)" stroke-width="5" stroke-linecap="round" opacity="0.6" />

  <!-- Acoustic Sound Waves (Right) -->
  <path d="M 190 100 A 36 36 0 0 1 190 156" fill="none" stroke="url(#wave-grad)" stroke-width="5" stroke-linecap="round" />
  <path d="M 206 84 A 56 56 0 0 1 206 172" fill="none" stroke="url(#wave-grad)" stroke-width="5" stroke-linecap="round" opacity="0.6" />

  <!-- Microphone Capsule Body -->
  <rect x="106" y="58" width="44" height="74" rx="22" fill="none" stroke="url(#cyan-glow)" stroke-width="7" filter="url(#glow)" />
  
  <!-- Capsule Mesh Grid -->
  <line x1="112" y1="84" x2="144" y2="84" stroke="#38bdf8" stroke-width="2.5" opacity="0.7" />
  <line x1="112" y1="96" x2="144" y2="96" stroke="#38bdf8" stroke-width="2.5" opacity="0.7" />
  <line x1="128" y1="62" x2="128" y2="128" stroke="#38bdf8" stroke-width="2.5" opacity="0.5" />

  <!-- Microphone Arc Support -->
  <path d="M 92 108 C 92 148 164 148 164 108" fill="none" stroke="url(#cyan-glow)" stroke-width="7" stroke-linecap="round" filter="url(#glow)" />

  <!-- Stand Stem & Base -->
  <line x1="128" y1="148" x2="128" y2="182" stroke="url(#cyan-glow)" stroke-width="7" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 104 184 L 152 184" fill="none" stroke="url(#cyan-glow)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
</svg>
